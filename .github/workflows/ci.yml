name: CI (build + smoke test)

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Also push image tags to Docker Hub (commit-xxxxxxx + upstream + latest)"
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: openclaw
  UPSTREAM_REPO: openclaw/openclaw

jobs:
  docker:
    name: Build + smoke test (linux/amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24 (for npm view)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect latest OpenClaw npm version
        id: upstream
        run: |
          set -euo pipefail
          npm_version="$(npm view openclaw@latest version)"
          if [ -z "${npm_version}" ]; then
            echo "Failed to resolve latest npm version for openclaw." >&2
            exit 1
          fi
          upstream_tag="v${npm_version}"
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "npm_version=${npm_version}" >> "$GITHUB_OUTPUT"
          echo "Using npm latest version: ${npm_version}"

      - name: Build image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: local/${{ env.IMAGE_NAME }}:amd64-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENCLAW_VERSION=${{ steps.upstream.outputs.npm_version }}

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm \
            -e OPENCLAW_AUTO_CONFIG=false \
            local/${{ env.IMAGE_NAME }}:amd64-ci \
            sh -lc "node --version && npm --version && python3 --version && pip3 --version && git --version && gh --version && aws --version && openclaw --version"

      - name: Port validation
        run: echo "Skipped (port fixed to 18789)"

      - name: Integration test (gateway startup + healthcheck + configurable port)
        run: |
          set -euo pipefail

          cid="$(docker run -d \
            -e OPENCLAW_AUTO_CONFIG=true \
            -e OPENCLAW_CLAWHUB_AUTO_INSTALL=false \
            -e OPENCLAW_PORT=18790 \
            -p 18790:18790 \
            local/${{ env.IMAGE_NAME }}:amd64-ci)"

          cleanup() {
            docker logs "${cid}" || true
            docker rm -f "${cid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${cid}")"
            if [ "${status}" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          status="$(docker inspect --format '{{.State.Health.Status}}' "${cid}")"
          test "${status}" = "healthy"

          curl --fail --silent --show-error http://127.0.0.1:18790/ >/dev/null

      - name: Login Docker Hub
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_image == 'true')
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (commit + upstream + latest)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_image == 'true')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          sha_short="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          repo="docker.io/${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}"
          commit_tag="commit-${sha_short}"

          for tag in "${commit_tag}" "${UPSTREAM_TAG}" latest; do
            docker tag local/${{ env.IMAGE_NAME }}:amd64-ci "${repo}:${tag}"
            docker push "${repo}:${tag}"
          done
