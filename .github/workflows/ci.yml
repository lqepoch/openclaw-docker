name: CI (build + smoke test)

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Also push dev tags to Docker Hub (edge + sha-xxxxxxx)"
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: openclaw

jobs:
  docker:
    name: Build + smoke test (linux/amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: local/${{ env.IMAGE_NAME }}:amd64-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm \
            -e OPENCLAW_AUTO_CONFIG=false \
            local/${{ env.IMAGE_NAME }}:amd64-ci \
            sh -lc "node --version && npm --version && python3 --version && pip3 --version && git --version && gh --version && aws --version && openclaw --version"

      - name: Port validation
        run: |
          set -euo pipefail
          if docker run --rm \
            -e OPENCLAW_AUTO_CONFIG=false \
            -e OPENCLAW_PORT=70000 \
            local/${{ env.IMAGE_NAME }}:amd64-ci true; then
            echo "Port validation failed: OPENCLAW_PORT=70000 should error" >&2
            exit 1
          fi

      - name: Login Docker Hub
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_image == 'true')
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (edge + sha)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_image == 'true')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          sha_short="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          repo="docker.io/${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}"

          for tag in edge "sha-${sha_short}"; do
            docker tag local/${{ env.IMAGE_NAME }}:amd64-ci "${repo}:${tag}"
            docker push "${repo}:${tag}"
          done
