name: Track upstream tag and auto-build image

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. Run every 3 hours starting at 00:00 UTC.
    - cron: '0 */3 * * *'

concurrency:
  group: upstream-tag-auto-build
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: openclaw
  UPSTREAM_REPO: openclaw/openclaw
  MARKER_TAG_PREFIX: upstream-

jobs:
  detect:
    name: Detect latest upstream tag
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.detect.outputs.upstream_tag }}
      npm_version: ${{ steps.detect.outputs.npm_version }}
      marker_tag: ${{ steps.detect.outputs.marker_tag }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Detect whether a new upstream tag requires a rebuild
        id: detect
        run: |
          set -euo pipefail

          git fetch --tags --force

          npm_version="$(npm view openclaw@latest version)"
          if [ -z "${npm_version}" ]; then
            echo "Failed to resolve npm latest version for openclaw." >&2
            exit 1
          fi
          upstream_tag="v${npm_version}"

          marker_tag="${MARKER_TAG_PREFIX}${upstream_tag}"
          should_build="true"

          if git rev-parse -q --verify "refs/tags/${marker_tag}" >/dev/null; then
            tagged_commit="$(git rev-parse "${marker_tag}")"
            head_commit="$(git rev-parse HEAD)"
            if [ "${tagged_commit}" = "${head_commit}" ]; then
              should_build="false"
            fi
          fi

          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "npm_version=${npm_version}" >> "$GITHUB_OUTPUT"
          echo "marker_tag=${marker_tag}" >> "$GITHUB_OUTPUT"
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"

          echo "Latest upstream tag: ${upstream_tag}"
          echo "npm version used for build: ${npm_version}"
          echo "Marker tag: ${marker_tag}"
          echo "Should build: ${should_build}"

  build-and-push:
    name: Build and publish image
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: local/${{ env.IMAGE_NAME }}:amd64-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENCLAW_VERSION=${{ needs.detect.outputs.npm_version }}

      - name: Run CLI smoke test
        run: |
          set -euo pipefail
          docker run --rm \
            -e OPENCLAW_AUTO_CONFIG=false \
            local/${{ env.IMAGE_NAME }}:amd64-test \
            sh -lc "node --version && npm --version && python3 --version && pip3 --version && git --version && gh --version && aws --version && openclaw --version"

      - name: Run integration startup test
        run: |
          set -euo pipefail

          cid="$(docker run -d \
            -e OPENCLAW_AUTO_CONFIG=true \
            -e OPENCLAW_CLAWHUB_AUTO_INSTALL=false \
            -e OPENCLAW_PORT=18790 \
            -p 18790:18790 \
            local/${{ env.IMAGE_NAME }}:amd64-test)"

          cleanup() {
            docker logs "${cid}" || true
            docker rm -f "${cid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${cid}")"
            if [ "${status}" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          status="$(docker inspect --format '{{.State.Health.Status}}' "${cid}")"
          test "${status}" = "healthy"

          curl --fail --silent --show-error http://127.0.0.1:18790/ >/dev/null

      - name: Derive semantic version aliases
        id: semver
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          major_tag=""
          minor_tag=""
          case "${UPSTREAM_TAG}" in
            *.*.*)
              major_tag="$(printf '%s' "${UPSTREAM_TAG}" | awk -F. '{print $1}')"
              minor_tag="$(printf '%s' "${UPSTREAM_TAG}" | awk -F. '{print $1"."$2}')"
              ;;
            *)
              echo "[warn] UPSTREAM_TAG is not in vX.Y.Z format, skipping major/minor aliases: ${UPSTREAM_TAG}" >&2
              ;;
          esac

          echo "major_tag=${major_tag}" >> "$GITHUB_OUTPUT"
          echo "minor_tag=${minor_tag}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push upstream version tags
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          dockerhub_repo="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          ghcr_repo="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"

          dockerhub_tag="${dockerhub_repo}:${UPSTREAM_TAG}"
          ghcr_tag="${ghcr_repo}:${UPSTREAM_TAG}"

          docker tag local/${{ env.IMAGE_NAME }}:amd64-test "${dockerhub_tag}"
          docker tag local/${{ env.IMAGE_NAME }}:amd64-test "${ghcr_tag}"

          docker push "${dockerhub_tag}"
          docker push "${ghcr_tag}"

      - name: Sync latest and major/minor aliases with imagetools
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          MAJOR_TAG: ${{ steps.semver.outputs.major_tag }}
          MINOR_TAG: ${{ steps.semver.outputs.minor_tag }}
        run: |
          set -euo pipefail

          dockerhub_repo="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          ghcr_repo="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"

          src_dockerhub="${dockerhub_repo}:${UPSTREAM_TAG}"
          src_ghcr="${ghcr_repo}:${UPSTREAM_TAG}"

          dockerhub_tags="--tag ${dockerhub_repo}:latest"
          ghcr_tags="--tag ${ghcr_repo}:latest"
          if [ -n "${MAJOR_TAG}" ] && [ -n "${MINOR_TAG}" ]; then
            dockerhub_tags="${dockerhub_tags} --tag ${dockerhub_repo}:${MAJOR_TAG} --tag ${dockerhub_repo}:${MINOR_TAG}"
            ghcr_tags="${ghcr_tags} --tag ${ghcr_repo}:${MAJOR_TAG} --tag ${ghcr_repo}:${MINOR_TAG}"
          fi

          docker buildx imagetools create ${dockerhub_tags} "${src_dockerhub}"
          docker buildx imagetools create ${ghcr_tags} "${src_ghcr}"

      - name: Update marker tag
        env:
          MARKER_TAG: ${{ needs.detect.outputs.marker_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${MARKER_TAG}"
          git push -f origin "refs/tags/${MARKER_TAG}"

  sync-latest:
    name: Sync latest aliases without rebuilding
    needs: detect
    if: needs.detect.outputs.should_build == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest and major/minor aliases
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          dockerhub_repo="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          ghcr_repo="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"

          major_tag=""
          minor_tag=""
          case "${UPSTREAM_TAG}" in
            *.*.*)
              major_tag="$(printf '%s' "${UPSTREAM_TAG}" | awk -F. '{print $1}')"
              minor_tag="$(printf '%s' "${UPSTREAM_TAG}" | awk -F. '{print $1"."$2}')"
              ;;
            *)
              echo "[warn] UPSTREAM_TAG is not in vX.Y.Z format, skipping major/minor aliases: ${UPSTREAM_TAG}" >&2
              ;;
          esac

          dockerhub_tags="--tag ${dockerhub_repo}:latest"
          ghcr_tags="--tag ${ghcr_repo}:latest"
          if [ -n "${major_tag}" ] && [ -n "${minor_tag}" ]; then
            dockerhub_tags="${dockerhub_tags} --tag ${dockerhub_repo}:${major_tag} --tag ${dockerhub_repo}:${minor_tag}"
            ghcr_tags="${ghcr_tags} --tag ${ghcr_repo}:${major_tag} --tag ${ghcr_repo}:${minor_tag}"
          fi

          docker buildx imagetools create ${dockerhub_tags} "${dockerhub_repo}:${UPSTREAM_TAG}"
          docker buildx imagetools create ${ghcr_tags} "${ghcr_repo}:${UPSTREAM_TAG}"
